<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書類進行カンバン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F4EC;
    --paper-deep:#EFE8D8;
    --card-bg:#FFFDF8;
    --ink:#262A3B;
    --navy:#33415C;
    --navy-soft:#4A5A78;
    --seal:#B23A2E;
    --seal-soft:#D9C9AE;
    --muted:#8B8574;
    --line:#DDD5C0;
    --shadow: 0 1px 2px rgba(38,42,59,0.06), 0 4px 14px rgba(38,42,59,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:1500px;
    margin:0 auto;
    padding:28px 24px 60px;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .app-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.04em;
    color:var(--navy);
    margin:0;
  }
  .app-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-top:4px;
  }
  .scope-legend{
    display:flex;
    gap:16px;
    font-size:11.5px;
    color:var(--muted);
    padding-top:4px;
  }
  .scope-legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.private{ background:var(--navy-soft); }
  .dot.shared{ background:var(--seal); }

  /* ---------- Category tabs (folder-tab style) ---------- */
  .tabs-row{
    display:flex;
    align-items:flex-end;
    gap:4px;
    flex-wrap:wrap;
    border-bottom:2px solid var(--navy);
    padding-bottom:0;
    margin-bottom:14px;
  }
  .tab{
    position:relative;
    padding:10px 16px 9px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    font-size:13.5px;
    font-weight:500;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .15s, color .15s, transform .1s;
    white-space:nowrap;
  }
  .tab:hover{ color:var(--navy); }
  .tab.active{
    background:var(--card-bg);
    color:var(--navy);
    font-weight:700;
    border-color:var(--navy);
    border-bottom:2px solid var(--card-bg);
    margin-bottom:-2px;
    padding-bottom:11px;
  }
  .tab .tab-del{
    font-size:14px;
    color:var(--seal-soft);
    line-height:1;
    padding:2px;
    border-radius:4px;
  }
  .tab .tab-del:hover{ color:var(--seal); background:rgba(178,58,46,0.08); }
  .tab-add{
    padding:10px 16px 9px;
    background:transparent;
    border:1px dashed var(--muted);
    border-radius:8px 8px 0 0;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    margin-bottom:1px;
  }
  .tab-add:hover{ color:var(--navy); border-color:var(--navy); }

  /* ---------- Phase toolbar ---------- */
  .phase-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:10px;
    flex-wrap:wrap;
  }
  .active-board-scope{
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .active-board-scope.shared{ color:var(--seal); }
  .phase-toolbar button{
    background:transparent;
    border:1px dashed var(--muted);
    color:var(--muted);
    border-radius:7px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }
  .phase-toolbar button:hover{ color:var(--navy); border-color:var(--navy); }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
  }
  .empty-state .stamp-mark{ margin:0 auto 18px; }
  .empty-state h2{
    font-family:'Shippori Mincho', serif;
    color:var(--navy);
    font-size:19px;
    margin:0 0 8px;
  }
  .empty-state button{ margin-top:16px; }

  /* ---------- Board ---------- */
  .board{
    display:grid;
    gap:14px;
    align-items:start;
  }
  .column{
    background:var(--paper-deep);
    border-radius:10px;
    padding:12px;
    min-height:200px;
    border:1px solid var(--line);
    min-width:0;
  }
  .column.drag-over{
    background:#E6DEC8;
    border-color:var(--navy-soft);
  }
  .column.col-drag-over{
    outline:2px dashed var(--seal);
    outline-offset:2px;
  }
  .col-head{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
    padding:0 2px;
    cursor:grab;
  }
  .col-title-wrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .col-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:0.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    padding:1px 2px;
    width:100%;
    font-family:inherit;
  }
  .col-title:hover{ border-bottom:1px dashed var(--navy-soft); }
  .col-title:focus{ outline:none; border-bottom:1px solid var(--navy); background:var(--card-bg); }
  .col-count{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    background:var(--paper);
    border-radius:10px;
    padding:1px 7px;
    flex:none;
  }
  .col-seal-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--seal);
    flex:none;
  }
  .col-del{
    background:transparent; border:none; color:var(--seal-soft); font-size:14px; cursor:pointer; padding:2px 3px; flex:none;
  }
  .col-del:hover{ color:var(--seal); }

  .card-list{ min-height:60px; display:flex; flex-direction:column; gap:8px; }
  .card{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px 10px;
    box-shadow:var(--shadow);
    cursor:grab;
    transition:transform .12s, box-shadow .12s;
  }
  .card:hover{ transform:translateY(-1px); box-shadow:0 3px 10px rgba(38,42,59,0.12); }
  .card.dragging{ opacity:0.4; }
  .card-title{
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    line-height:1.45;
    margin:0 0 6px;
    padding-right:26px;
  }
  .card-meta{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .card-meta .due.overdue{ color:var(--seal); font-weight:500; }
  .card-progress{ display:flex; align-items:center; gap:5px; }
  .card-progress-bar{
    width:36px; height:4px; border-radius:2px; background:var(--line); overflow:hidden;
  }
  .card-progress-fill{ height:100%; background:var(--navy-soft); }

  /* hanko stamp mark on phases whose label contains 印 */
  .stamp-mark{
    position:absolute;
    top:8px; right:8px;
    width:30px; height:30px;
    border:2px solid var(--seal);
    border-radius:6px;
    color:var(--seal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:14px;
    transform:rotate(-8deg);
    opacity:0.85;
    pointer-events:none;
  }

  .add-card-btn{
    width:100%;
    background:transparent;
    border:1px dashed var(--muted);
    border-radius:8px;
    color:var(--muted);
    font-size:12px;
    padding:8px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-card-btn:hover{ color:var(--navy); border-color:var(--navy); }

  .add-phase-col{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:80px;
  }
  .add-phase-btn{
    width:100%;
    height:100%;
    min-height:80px;
    background:transparent;
    border:1px dashed var(--muted);
    border-radius:10px;
    color:var(--muted);
    font-size:12.5px;
    cursor:pointer;
  }
  .add-phase-btn:hover{ color:var(--navy); border-color:var(--navy); }

  /* ---------- Buttons (generic) ---------- */
  button{ font-family:inherit; }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:9px 16px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{ background:var(--navy-soft); }
  .btn.seal{ background:var(--seal); }
  .btn.seal:hover{ background:#963025; }
  .btn.ghost{
    background:transparent; color:var(--muted); border:1px solid var(--line);
  }
  .btn.ghost:hover{ color:var(--navy); border-color:var(--navy); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(38,42,59,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--card-bg);
    border-radius:12px;
    padding:22px;
    width:100%; max-width:400px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
  }
  .modal h3{
    font-family:'Shippori Mincho', serif;
    color:var(--navy); font-size:16px; margin:0 0 8px;
  }
  .modal p.modal-hint{
    font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5;
  }
  .modal input[type=text], .modal input[type=date]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    margin-bottom:14px;
  }
  .modal input:focus{ outline:2px solid var(--navy-soft); outline-offset:1px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

  .field-label{
    font-size:11px; font-weight:700; color:var(--navy); letter-spacing:0.06em;
    text-transform:uppercase; margin:0 0 8px;
  }
  .scope-choice{
    display:flex; gap:8px; margin-bottom:6px;
  }
  .scope-btn{
    flex:1;
    padding:10px 8px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition:border-color .15s, color .15s;
  }
  .scope-btn .dot{ width:9px; height:9px; }
  .scope-btn.selected[data-scope="private"]{ border-color:var(--navy); color:var(--navy); background:#EEF1F5; }
  .scope-btn.selected[data-scope="shared"]{ border-color:var(--seal); color:var(--seal); background:#F8ECE9; }
  .scope-desc{
    font-size:12px; color:var(--muted); line-height:1.5; margin:8px 0 16px; min-height:34px;
  }

  /* ---------- Detail panel ---------- */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(38,42,59,0.3);
    z-index:60;
  }
  .panel{
    position:fixed; top:0; right:0; bottom:0;
    width:min(420px, 92vw);
    background:var(--card-bg);
    box-shadow:-6px 0 30px rgba(0,0,0,0.15);
    z-index:61;
    display:flex; flex-direction:column;
    animation:slideIn .18s ease-out;
  }
  @keyframes slideIn{ from{ transform:translateX(24px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
  .panel-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:flex-start; gap:10px;
  }
  .panel-title{
    flex:1;
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    border:none;
    background:transparent;
    resize:none;
    width:100%;
    line-height:1.4;
  }
  .panel-title:focus{ outline:none; }
  .panel-close{
    background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;
    padding:2px 4px;
  }
  .panel-close:hover{ color:var(--seal); }
  .panel-body{ padding:16px 20px; overflow-y:auto; flex:1; }
  .field-block-label{
    font-size:11px; font-weight:700; color:var(--navy); letter-spacing:0.06em;
    text-transform:uppercase; margin:18px 0 8px;
  }
  .field-block-label:first-child{ margin-top:0; }
  .phase-select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; font-family:inherit; color:var(--ink); background:var(--paper);
  }
  .due-input{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; font-family:inherit; color:var(--ink); background:var(--paper);
  }
  .todo-add-row{ display:flex; gap:6px; margin-bottom:10px; }
  .todo-add-row input{
    flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; font-family:inherit; background:var(--paper); color:var(--ink);
  }
  .todo-add-row button{
    background:var(--navy); color:#fff; border:none; border-radius:6px; padding:0 12px; cursor:pointer; font-size:15px;
  }
  .todo-list{ display:flex; flex-direction:column; gap:6px; }
  .todo-item{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:7px 9px;
  }
  .todo-item input[type=checkbox]{ width:16px; height:16px; accent-color:var(--navy); flex:none; cursor:pointer;}
  .todo-item span{ flex:1; font-size:13px; color:var(--ink); }
  .todo-item.done span{ color:var(--muted); text-decoration:line-through; }
  .todo-del{
    background:transparent; border:none; color:var(--seal-soft); cursor:pointer; font-size:15px; padding:2px 4px;
  }
  .todo-del:hover{ color:var(--seal); }
  .todo-empty{ color:var(--muted); font-size:12.5px; padding:6px 2px; }
  .memo-box{
    width:100%; min-height:110px; border:1px solid var(--line); border-radius:6px;
    padding:10px; font-family:inherit; font-size:13px; color:var(--ink); background:var(--paper); resize:vertical;
  }
  .memo-box:focus, .phase-select:focus, .due-input:focus{ outline:2px solid var(--navy-soft); outline-offset:1px; }
  .panel-foot{
    padding:14px 20px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-scope-tag{
    font-size:10.5px; font-family:'JetBrains Mono', monospace; color:var(--muted);
    display:flex; align-items:center; gap:5px;
  }
  .panel-scope-tag.shared{ color:var(--seal); }

  .tab-lock{ font-size:10px; opacity:0.75; }

  .storage-banner{
    background:#F8ECE9;
    border:1px solid var(--seal-soft);
    color:#7A2B21;
    padding:12px 14px;
    border-radius:8px;
    font-size:12.5px;
    line-height:1.6;
    margin-bottom:16px;
  }
  .storage-banner strong{ color:var(--seal); }
  .storage-banner.info{
    background:#EEF1F5;
    border-color:var(--navy-soft);
    color:var(--navy);
  }
  .storage-banner.info strong{ color:var(--navy); }

  .toolbar-select{
    font-size:12px; padding:6px 10px; border:1px solid var(--line); border-radius:7px;
    background:var(--card-bg); color:var(--ink); font-family:inherit;
  }

  .assignee-tag{
    display:flex; align-items:center; gap:5px;
    font-weight:600; color:var(--ink);
  }
  .assignee-dot{ width:7px; height:7px; border-radius:50%; flex:none; }

  .swatch-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .swatch{
    width:26px; height:26px; border-radius:50%;
    border:2px solid transparent; cursor:pointer; padding:0;
  }
  .swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--card-bg), 0 0 0 4px var(--ink); }
  .swatch-none{
    background:var(--paper) !important; color:var(--muted); font-size:12px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--muted) !important;
  }
  .swatch-current{ font-size:12px; color:var(--muted); margin:0 0 4px; }

  .assignee-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; max-height:340px; overflow-y:auto; }
  .assignee-row{ display:flex; align-items:center; gap:10px; }
  .assignee-row .swatch{ flex:none; }
  .assignee-name-input{
    flex:1; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; font-family:inherit; background:var(--paper); color:var(--ink);
    margin-bottom:0 !important;
  }
  .assignee-name-input:focus{ outline:2px solid var(--navy-soft); outline-offset:1px; }

  .lock-box{ max-width:280px; margin:16px auto 0; text-align:left; }
  .lock-box input{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:13.5px; font-family:inherit; background:var(--card-bg); color:var(--ink);
  }
  .lock-box input:focus{ outline:2px solid var(--navy-soft); outline-offset:1px; }
  .lock-error{ color:var(--seal); font-size:12px; margin:8px 0 0; display:none; }

  @media (max-width: 980px){
    .board{ grid-template-columns:1fr !important; }
  }

  /* ---------- Toast (dismissable, in-page error notice) ---------- */
  .toast{
    position:fixed;
    bottom:20px;
    right:20px;
    max-width:340px;
    background:var(--ink);
    color:#F8F4EC;
    border-radius:10px;
    padding:14px 14px 12px;
    box-shadow:0 8px 28px rgba(0,0,0,0.28);
    z-index:80;
    font-size:12.5px;
    line-height:1.5;
  }
  .toast-msg{ margin-bottom:10px; }
  .toast-actions{ display:flex; justify-content:flex-end; gap:8px; align-items:center; }
  .toast-retry{
    background:var(--seal); color:#fff; border:none; border-radius:6px;
    padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .toast-retry:hover{ background:#963025; }
  .toast-close{
    background:transparent; border:1px solid rgba(248,244,236,0.35); color:#F8F4EC;
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .toast-close:hover{ border-color:#F8F4EC; }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div>
      <p class="app-title">書類進行カンバン</p>
      <p class="app-sub">カテゴリごとにフェーズを自由に設計できます</p>
      <div class="scope-legend">
        <span><span class="dot private"></span>個人用（自分だけに見える）</span>
        <span><span class="dot shared"></span>共有（開いた人全員に見える）</span>
      </div>
    </div>
    <button class="btn ghost" id="refreshBtn">🔄 データを再読み込み</button>
  </div>

  <div id="storageBanner" class="storage-banner" style="display:none;"></div>
  <div id="supabaseBanner" class="storage-banner" style="display:none;"></div>

  <div id="tabsRow" class="tabs-row"></div>
  <div id="phaseToolbar" class="phase-toolbar"></div>
  <div id="boardArea"></div>
</div>

<script>
// デフォルトのフェーズ構成（新規カテゴリ作成時 / 旧データの移行に使用）
const DEFAULT_PHASES = [
  { id:'draft',     label:'ドラフト中' },
  { id:'confirmed', label:'内容確定' },
  { id:'sealed',    label:'押印済み' },
  { id:'mailed',    label:'郵送済み' },
  { id:'done',      label:'完了' },
];

const STORAGE_KEYS = { private: 'kanban-data-private', shared: 'kanban-data-shared' };

// ▼▼▼ 共有カテゴリをClaudeアカウント無しの人とも共有したい場合はここを設定 ▼▼▼
// Supabase（無料枠あり）のプロジェクトURLとanon keyを入力してください。
// 未設定（下の初期値のまま）の場合は、共有カテゴリは従来どおりClaudeの保存機能（ログイン必須）を使います。
const SUPABASE_URL = 'https://mnojtomhznktsksnsobu.supabase.co';        // 例: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_wqoduXr8dy7kr3hUY_UECw_6WC6WPGR';
// ▲▲▲ ここまで ▲▲▲

function isSupabaseConfigured(){
  return SUPABASE_URL && SUPABASE_ANON_KEY
    && SUPABASE_URL !== 'YOUR_SUPABASE_URL'
    && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
}

// SUPABASE_URLに "https://xxxx.supabase.co" ではなく
// "https://xxxx.supabase.co/rest/v1" のようなREST APIエンドポイントが
// 貼り付けられていても動くように正規化する
function normalizedSupabaseUrl(){
  let url = (SUPABASE_URL || '').trim();
  url = url.replace(/\/rest\/v1\/?$/i, ''); // 末尾の /rest/v1 または /rest/v1/ を除去
  url = url.replace(/\/+$/, '');            // 末尾の余分なスラッシュを除去
  return url;
}

async function fetchSharedFromSupabase(){
  const res = await fetch(`${normalizedSupabaseUrl()}/rest/v1/kanban_shared?id=eq.shared&select=data`, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    }
  });
  if(!res.ok) throw new Error('Supabase fetch failed: ' + res.status);
  const rows = await res.json();
  if(rows && rows[0] && rows[0].data) return rows[0].data;
  return { boards: [], cards: [] };
}

async function saveSharedToSupabase(payload){
  const res = await fetch(`${normalizedSupabaseUrl()}/rest/v1/kanban_shared`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify([{ id: 'shared', data: payload, updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('Supabase save failed: ' + res.status);
}

let stores = {

};

let draggingCardId = null;
let draggingPhaseId = null;
let unlockedBoards = new Set();
const UNLOCKED_KEY = 'unlocked-boards';
let colorFilter = null; // null=すべて表示 / 'none'=未割り当てのみ / 0-9=その色のみ
let sharedLoadError = false;
let sharedLoadErrorMessage = '';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clonePhases(){ return DEFAULT_PHASES.map(p => ({ id: uid(), label: p.label })); }

function allBoards(){ return [...stores.private.boards, ...stores.shared.boards]; }
function allCards(){ return [...stores.private.cards, ...stores.shared.cards]; }
function storeOf(scope){ return stores[scope]; }

// パスワードはハッシュ化して保存する（簡易的な仕組みで、完全なセキュリティではない点に注意）
async function hashPassword(pw){
  const raw = 'doc-kanban-salt:' + pw;
  try{
    if(window.crypto && window.crypto.subtle){
      const enc = new TextEncoder().encode(raw);
      const buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* フォールバックへ */ }
  let h = 0;
  for(let i=0;i<raw.length;i++){ h = (h*31 + raw.charCodeAt(i)) >>> 0; }
  return 'fb' + h.toString(16);
}

function isLocked(board){
  return !!(board && board.scope === 'shared' && board.passwordHash && !unlockedBoards.has(board.id));
}

async function loadUnlocked(){
  try{
    const res = await window.storage.get(UNLOCKED_KEY, false);
    if(res && res.value){
      unlockedBoards = new Set(JSON.parse(res.value));
    }
  }catch(e){
    // 未解除の状態がまだ無い場合はここに来る
  }
}
function saveUnlocked(){
  window.storage.set(UNLOCKED_KEY, JSON.stringify([...unlockedBoards]), false).catch(()=>{
    showSaveErrorToast('unlocked');
  });
}

async function loadScope(scope, shared){
  if(scope === 'shared' && isSupabaseConfigured()){
    try{
      const data = await fetchSharedFromSupabase();
      stores.shared.boards = data.boards || [];
      stores.shared.cards = data.cards || [];
      sharedLoadError = false;
    }catch(e){
      // 通信エラー等。空のままにしておく（画面上のバナー／トーストで案内する）
      sharedLoadError = true;
      sharedLoadErrorMessage = (e && e.message) ? e.message : String(e);
    }
  } else if(scope !== 'shared'){
    try{
      const res = await window.storage.get(STORAGE_KEYS[scope], shared);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        stores[scope].boards = parsed.boards || [];
        stores[scope].cards = parsed.cards || [];
      }
    }catch(e){
      // まだデータが無い場合はここに来る
    }
  }
  // scope === 'shared' かつ Supabase未設定の場合は何もしない（空のまま）
  stores[scope].boards.forEach(b=>{
    b.scope = scope;
    b.passwordHash = b.passwordHash || null;
    if(!b.phases || !b.phases.length){
      b.phases = DEFAULT_PHASES.map(p=>({ id:p.id, label:p.label }));
    }
    if(!Array.isArray(b.assigneeNames) || b.assigneeNames.length !== PALETTE.length){
      b.assigneeNames = PALETTE.map(()=> '');
    }
  });
  stores[scope].cards.forEach(c=>{
    c.scope = scope;
    if(c.colorIndex === undefined) c.colorIndex = null;
  });
}

async function loadData(){
  await loadScope('private', false);
  await loadScope('shared', true);
  await loadUnlocked();
  if(allBoards().length && !activeBoardId){
    activeBoardId = allBoards()[0].id;
  }
}

const saveTimers = {};
function saveData(scope){
  clearTimeout(saveTimers[scope]);
  saveTimers[scope] = setTimeout(async () => {
    try{
      const store = stores[scope];
      const payload = { boards: store.boards, cards: store.cards };
      if(scope === 'shared'){
        if(!isSupabaseConfigured()){
          throw new Error('Supabase未設定');
        }
        await saveSharedToSupabase(payload);
      } else {
        await window.storage.set(STORAGE_KEYS[scope], JSON.stringify(payload), false);
      }
      removeToast(scope);
    }catch(e){
      showSaveErrorToast(scope);
    }
  }, 150);
}

function removeToast(scope){
  const el = document.getElementById('toast-' + scope);
  if(el) el.remove();
}

function showSaveErrorToast(scope){
  removeToast(scope);
  const label = scope === 'shared' ? '共有' : '個人用';
  const msg = (scope === 'shared' && !isSupabaseConfigured())
    ? 'まだSupabaseの接続設定（SUPABASE_URL / SUPABASE_ANON_KEY）が完了していないため、共有データを保存できません。'
    : `「${label}」データの保存に失敗しました。通信状況をご確認のうえ再試行してください。`;
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.id = 'toast-' + scope;
  toast.innerHTML = `
    <div class="toast-msg">${msg}</div>
    <div class="toast-actions">
      <button class="toast-retry" id="toastRetry-${scope}">再試行</button>
      <button class="toast-close" id="toastClose-${scope}">×</button>
    </div>`;
  document.body.appendChild(toast);
  toast.querySelector('#toastClose-' + scope).addEventListener('click', ()=> toast.remove());
  toast.querySelector('#toastRetry-' + scope).addEventListener('click', ()=>{
    toast.remove();
    saveData(scope);
  });
}

function getActiveBoard(){
  return allBoards().find(b=>b.id===activeBoardId) || null;
}

function esc(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function isStampPhase(label){
  return (label||'').includes('印');
}

function render(){
  renderTabs();
  renderToolbar();
  renderBoard();
}

function renderTabs(){
  const row = document.getElementById('tabsRow');
  let html = '';
  allBoards().forEach(b => {
    const active = b.id === activeBoardId ? ' active' : '';
    html += `<div class="tab${active}" data-board="${b.id}">
      <span class="dot ${b.scope}"></span>
      <span class="tab-name">${esc(b.name)}</span>
      ${b.passwordHash ? '<span class="tab-lock" title="パスワード保護あり">🔒</span>' : ''}
      <span class="tab-del" data-del-board="${b.id}" title="カテゴリを削除">×</span>
    </div>`;
  });
  html += `<div class="tab-add" id="addBoardBtn">＋ 新規カテゴリ</div>`;
  row.innerHTML = html;

  row.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.dataset.delBoard) return;
      activeBoardId = el.dataset.board;
      colorFilter = null;
      render();
    });
  });
  row.querySelectorAll('[data-del-board]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.dataset.delBoard;
      const board = allBoards().find(b=>b.id===id);
      if(!board) return;
      openConfirmModal({
        title: 'カテゴリを削除',
        message: `「${board.name}」を削除しますか？中のカードもすべて削除されます。`,
        confirmLabel: '削除する',
        onConfirm(){
          const store = storeOf(board.scope);
          store.boards = store.boards.filter(b=>b.id!==id);
          store.cards = store.cards.filter(c=>c.boardId!==id);
          if(activeBoardId === id){
            const remaining = allBoards();
            activeBoardId = remaining.length ? remaining[0].id : null;
          }
          saveData(board.scope);
          render();
        }
      });
    });
  });
  document.getElementById('addBoardBtn').addEventListener('click', openNewBoardModal);
}

function renderBoard(){
  const area = document.getElementById('boardArea');
  const board = getActiveBoard();
  if(!board){
    area.innerHTML = `
      <div class="empty-state">
        <div class="stamp-mark" style="position:static; display:inline-flex; transform:rotate(-6deg);">印</div>
        <h2>カテゴリがまだありません</h2>
        <p>「取締役会議事録」「役員派遣契約」のように、書類の種類ごとにカンバンを作成できます。個人用と共有用を自由に使い分けられます。</p>
        <button class="btn seal" id="emptyAddBoardBtn">＋ 最初のカテゴリを作成</button>
      </div>`;
    document.getElementById('emptyAddBoardBtn').addEventListener('click', openNewBoardModal);
    return;
  }

  if(isLocked(board)){
    renderLockScreen(board);
    return;
  }

  const phases = board.phases;
  const cards = allCards().filter(c => c.boardId === activeBoardId)
    .filter(c => {
      if(colorFilter === null) return true;
      if(colorFilter === 'none') return c.colorIndex == null;
      return c.colorIndex === Number(colorFilter);
    });
  let html = `<div class="board" style="grid-template-columns:repeat(${phases.length}, minmax(210px, 1fr)) 130px;">`;

  phases.forEach(phase=>{
    const phaseCards = cards.filter(c=>c.phase===phase.id);
    const stamp = isStampPhase(phase.label);
    html += `<div class="column" draggable="true" data-phase="${phase.id}">
      <div class="col-head">
        <div class="col-title-wrap">
          ${stamp ? '<span class="col-seal-dot"></span>' : ''}
          <input class="col-title" data-rename="${phase.id}" value="${esc(phase.label)}" maxlength="12">
        </div>
        <div class="col-count">${phaseCards.length}</div>
        <button class="col-del" data-del-phase="${phase.id}" title="フェーズを削除">×</button>
      </div>
      <div class="card-list" data-phase="${phase.id}">`;
    phaseCards.forEach(card=>{
      const total = card.todos.length;
      const doneCount = card.todos.filter(t=>t.done).length;
      const pct = total ? Math.round(doneCount/total*100) : 0;
      const overdue = card.dueDate && new Date(card.dueDate) < new Date(new Date().toDateString());
      const hasColor = card.colorIndex != null;
      const colorHex = hasColor ? PALETTE[card.colorIndex].hex : null;
      const assigneeName = hasColor ? (board.assigneeNames[card.colorIndex] || PALETTE[card.colorIndex].name) : null;
      html += `<div class="card" draggable="true" data-card="${card.id}" style="${hasColor ? `border-left:4px solid ${colorHex};` : ''}">
        ${stamp ? '<div class="stamp-mark">印</div>' : ''}
        <p class="card-title">${esc(card.title)}</p>
        <div class="card-meta">
          ${assigneeName ? `<span class="assignee-tag"><span class="assignee-dot" style="background:${colorHex}"></span>${esc(assigneeName)}</span>` : ''}
          ${total ? `<div class="card-progress"><div class="card-progress-bar"><div class="card-progress-fill" style="width:${pct}%"></div></div><span>${doneCount}/${total}</span></div>` : ''}
          ${card.dueDate ? `<span class="due${overdue ? ' overdue' : ''}">${formatDate(card.dueDate)}</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div><button class="add-card-btn" data-add-phase="${phase.id}">＋ カード追加</button></div>`;
  });

  html += `<div class="add-phase-col"><button class="add-phase-btn" id="addPhaseBtnCol">＋<br>フェーズ<br>追加</button></div>`;
  html += '</div>';
  area.innerHTML = html;

  document.getElementById('addPhaseBtnCol').addEventListener('click', addPhase);

  area.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.dataset.card));
    el.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      draggingCardId = el.dataset.card;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      draggingCardId = null;
    });
  });

  area.querySelectorAll('.column').forEach(col=>{
    col.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(draggingCardId) col.classList.add('drag-over');
      else if(draggingPhaseId && draggingPhaseId !== col.dataset.phase) col.classList.add('col-drag-over');
    });
    col.addEventListener('dragleave', ()=>{
      col.classList.remove('drag-over');
      col.classList.remove('col-drag-over');
    });
    col.addEventListener('drop', (e)=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      col.classList.remove('col-drag-over');
      if(draggingCardId){
        const card = allCards().find(c=>c.id===draggingCardId);
        if(card){
          card.phase = col.dataset.phase;
          saveData(card.scope);
          render();
        }
      } else if(draggingPhaseId && draggingPhaseId !== col.dataset.phase){
        reorderPhases(draggingPhaseId, col.dataset.phase);
      }
    });
  });

  area.querySelectorAll('.column').forEach(col=>{
    col.addEventListener('dragstart', (e)=>{
      if(e.target.closest('.card')) return;
      draggingPhaseId = col.dataset.phase;
    });
    col.addEventListener('dragend', ()=>{ draggingPhaseId = null; });
  });

  area.querySelectorAll('[data-add-phase]').forEach(btn=>{
    btn.addEventListener('click', ()=> openNewCardModal(btn.dataset.addPhase));
  });

  area.querySelectorAll('[data-rename]').forEach(input=>{
    input.addEventListener('click', (e)=> e.stopPropagation());
    input.addEventListener('dragstart', (e)=> e.preventDefault());
    input.addEventListener('change', ()=>{
      const phase = board.phases.find(p=>p.id===input.dataset.rename);
      const val = input.value.trim();
      if(phase && val){
        phase.label = val;
        saveData(board.scope);
        render();
      } else {
        input.value = phase ? phase.label : '';
      }
    });
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') input.blur(); });
  });

  area.querySelectorAll('[data-del-phase]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deletePhase(btn.dataset.delPhase);
    });
  });
}

function renderLockScreen(board){
  const area = document.getElementById('boardArea');
  area.innerHTML = `
    <div class="empty-state">
      <div class="stamp-mark" style="position:static; display:inline-flex; transform:rotate(-6deg);">錠</div>
      <h2>「${esc(board.name)}」はパスワードで保護されています</h2>
      <p>共有カテゴリの内容を見るには、アクセスパスワードを入力してください。一度入力すれば、このデバイス・アカウントでは次回から自動的に解除された状態になります。</p>
      <div class="lock-box">
        <input type="password" id="lockPwInput" placeholder="パスワード" autocomplete="off">
        <p class="lock-error" id="lockError">パスワードが違います。もう一度お試しください。</p>
      </div>
      <button class="btn seal" id="lockUnlockBtn" style="margin-top:14px;">ロックを解除</button>
    </div>`;

  const input = area.querySelector('#lockPwInput');
  const errorEl = area.querySelector('#lockError');
  input.focus();

  const attempt = async ()=>{
    const val = input.value;
    if(!val) return;
    const hash = await hashPassword(val);
    if(hash === board.passwordHash){
      unlockedBoards.add(board.id);
      saveUnlocked();
      render();
    } else {
      errorEl.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  area.querySelector('#lockUnlockBtn').addEventListener('click', attempt);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });
}

function openPasswordSettingsModal(board){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>共有パスワードの設定</h3>
      <p class="modal-hint">パスワードを知っている人だけが、このカテゴリを開けるようになります。<strong>ただしこれはページ内で行う簡易的な制限であり、ブラウザの開発者ツールなどで技術的に迂回され得ます。</strong>本当に機密性の高い情報の保護には使わないでください。</p>
      <input type="password" id="pwSettingInput" placeholder="新しいパスワード（空欄で保護を解除）" autocomplete="off">
      <div class="modal-actions">
        <button class="btn ghost" id="pwCancel">キャンセル</button>
        <button class="btn seal" id="pwSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pwSettingInput');
  input.focus();
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#pwCancel').addEventListener('click', close);
  const submit = async ()=>{
    const val = input.value.trim();
    if(val){
      board.passwordHash = await hashPassword(val);
      unlockedBoards.add(board.id);
      saveUnlocked();
    } else {
      board.passwordHash = null;
    }
    saveData(board.scope);
    close();
    render();
  };
  overlay.querySelector('#pwSave').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
}

    </div>`).join('');
  overlay.innerHTML = `
    <div class="modal" style="max-width:340px;">
      <h3>担当者を色に割り当て</h3>
      <p class="modal-hint">各色に担当者名を入力してください。空欄のままの色は、色名（例：${esc(PALETTE[0].name)}）で表示されます。</p>
      <div class="assignee-list">${rows}</div>
      <div class="modal-actions">
        <button class="btn ghost" id="assigneeCancel">キャンセル</button>
        <button class="btn seal" id="assigneeSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#assigneeCancel').addEventListener('click', close);
  overlay.querySelector('#assigneeSave').addEventListener('click', ()=>{
    overlay.querySelectorAll('.assignee-name-input').forEach(input=>{
      board.assigneeNames[Number(input.dataset.idx)] = input.value.trim();
    });
    saveData(board.scope);
    close();
    render();
  });
}

function reorderPhases(draggedId, targetId){
  const board = getActiveBoard();
  if(!board) return;
  const fromIdx = board.phases.findIndex(p=>p.id===draggedId);
  const toIdx = board.phases.findIndex(p=>p.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  const [moved] = board.phases.splice(fromIdx,1);
  board.phases.splice(toIdx,0,moved);
  saveData(board.scope);
  render();
}

function addPhase(){
  const board = getActiveBoard();
  if(!board) return;
  openPromptModal({
    title: '新しいフェーズを追加',
    hint: '例：法務確認中、支店長承認待ち',
    placeholder: 'フェーズ名',
    confirmLabel: '追加',
    onSubmit(label){
      board.phases.push({ id: uid(), label });
      saveData(board.scope);
      render();
    }
  });
}

function deletePhase(phaseId){
  const board = getActiveBoard();
  if(!board) return;
  if(board.phases.length <= 1){
    openInfoModal('削除できません', '最後の1つのフェーズは削除できません。カテゴリには少なくとも1つのフェーズが必要です。');
    return;
  }
  const phase = board.phases.find(p=>p.id===phaseId);
  if(!phase) return;
  const cardsInPhase = allCards().filter(c=>c.boardId===activeBoardId && c.phase===phaseId);
  const idx = board.phases.findIndex(p=>p.id===phaseId);
  const fallback = board.phases[idx-1] || board.phases[idx+1];

  let msg = `フェーズ「${phase.label}」を削除しますか？`;
  if(cardsInPhase.length){
    msg += ` 中にある ${cardsInPhase.length} 件のカードは「${fallback.label}」に移動されます。`;
  }
  openConfirmModal({
    title: 'フェーズを削除',
    message: msg,
    confirmLabel: '削除する',
    onConfirm(){
      cardsInPhase.forEach(c=> c.phase = fallback.id);
      board.phases = board.phases.filter(p=>p.id!==phaseId);
      saveData(board.scope);
      render();
    }
  });
}

function formatDate(d){
  const dt = new Date(d);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

/* ---------------- New board modal (with scope choice) ---------------- */

function openNewBoardModal(){
  let selectedScope = 'private';
  const descriptions = {
    private: '個人用：あなたのアカウントだけに表示されます。他の人がこのツールを開いても見えません。',
    shared: isSupabaseConfigured()
      ? '共有：Supabase経由で保存されるため、Claudeアカウントを持たない人も含め、リンクを開いた人全員が同じデータを閲覧＆編集できます。'
      : '共有：このツールを開いた人全員が同じカテゴリ・カード・Todoを閲覧＆編集できます（現在はClaudeの保存機能を使用中。Claudeアカウントが無い人とも共有するにはSupabaseの設定が必要です）。',
  };
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>新規カテゴリを作成</h3>
      <input type="text" id="newBoardName" placeholder="例：取締役会議事録" maxlength="40">
      <div class="field-label">公開範囲</div>
      <div class="scope-choice">
        <button type="button" class="scope-btn selected" data-scope="private"><span class="dot private"></span>個人用</button>
        <button type="button" class="scope-btn" data-scope="shared"><span class="dot shared"></span>共有</button>
      </div>
      <p class="scope-desc" id="scopeDesc">${descriptions.private}</p>
      <div id="pwSection" style="display:none;">
        <div class="field-label">アクセスパスワード（任意）</div>
        <input type="password" id="newBoardPassword" placeholder="空欄の場合は保護なし" autocomplete="off">
        <p class="modal-hint">設定すると、知っている人だけがこのカテゴリを開けます。開発者ツール等で迂回され得る簡易的な制限である点にご注意ください。</p>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelBoard">キャンセル</button>
        <button class="btn seal" id="confirmBoard">作成</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#newBoardName');
  const desc = overlay.querySelector('#scopeDesc');
  const pwSection = overlay.querySelector('#pwSection');
  const pwInput = overlay.querySelector('#newBoardPassword');
  input.focus();

  overlay.querySelectorAll('.scope-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedScope = btn.dataset.scope;
      overlay.querySelectorAll('.scope-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      desc.textContent = descriptions[selectedScope];
      pwSection.style.display = selectedScope === 'shared' ? 'block' : 'none';
    });
  });

  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#cancelBoard').addEventListener('click', close);
  const submit = async ()=>{
    const name = input.value.trim();
    if(!name) return;
    let passwordHash = null;
    if(selectedScope === 'shared' && pwInput.value.trim()){
      passwordHash = await hashPassword(pwInput.value.trim());
    }
    const board = { id: uid(), name, scope: selectedScope, phases: clonePhases(), passwordHash, assigneeNames: PALETTE.map(()=> ''), createdAt: Date.now() };
    storeOf(selectedScope).boards.push(board);
    activeBoardId = board.id;
    if(passwordHash){
      unlockedBoards.add(board.id);
      saveUnlocked();
    }
    saveData(selectedScope);
    close();
    render();
  };
  overlay.querySelector('#confirmBoard').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });

/* ---------------- Detail panel ---------------- */

function openDetail(cardId){
  const card = allCards().find(c=>c.id===cardId);
  const board = getActiveBoard();
  if(!card || !board) return;

  const overlay = document.createElement('div');
  overlay.className = 'panel-overlay';
  const panel = document.createElement('div');
  panel.className = 'panel';

  panel.innerHTML = `
    <div class="panel-head">
      <textarea class="panel-title" rows="2" id="detTitle">${esc(card.title)}</textarea>
      <button class="panel-close" id="detClose">×</button>
    </div>
    <div class="panel-body">
      <div class="field-block-label">フェーズ</div>
      <select class="phase-select" id="detPhase">
        ${board.phases.map(p=>`<option value="${p.id}" ${p.id===card.phase?'selected':''}>${esc(p.label)}</option>`).join('')}
      </select>

      <div class="field-block-label">担当者（色）</div>
      <div class="swatch-row" id="swatchRow">
        ${PALETTE.map((p,i)=>`<button type="button" class="swatch ${card.colorIndex===i?'selected':''}" data-idx="${i}" style="background:${p.hex}" title="${esc(board.assigneeNames[i] || p.name)}"></button>`).join('')}
        <button type="button" class="swatch swatch-none ${card.colorIndex==null?'selected':''}" data-idx="none" title="未設定">×</button>
      </div>
      <p class="swatch-current" id="swatchCurrent">${card.colorIndex!=null ? esc(board.assigneeNames[card.colorIndex] || PALETTE[card.colorIndex].name) : '担当者未設定'}</p>

      <div class="field-block-label">期限</div>
      <input type="date" class="due-input" id="detDue" value="${card.dueDate||''}">

      <div class="field-block-label">Todo</div>
      <div class="todo-add-row">
        <input type="text" id="todoInput" placeholder="タスクを追加...">
        <button id="todoAddBtn">＋</button>
      </div>
      <div class="todo-list" id="todoList"></div>

      <div class="field-block-label">メモ</div>
      <textarea class="memo-box" id="detMemo" placeholder="補足事項・連絡先・注意点など">${esc(card.memo)}</textarea>
    </div>
    <div class="panel-foot">
      <button class="btn ghost" id="detDelete">カードを削除</button>
      <span class="panel-scope-tag ${board.scope==='shared'?'shared':''}">
        <span class="dot ${board.scope}"></span>${board.scope==='shared' ? '共有中・自動保存' : '個人用・自動保存'}
      </span>
    </div>
  `;

  document.body.appendChild(overlay);
  document.body.appendChild(panel);

  function closePanel(){
    overlay.remove();
    panel.remove();
    render();
  }
  overlay.addEventListener('click', closePanel);
  panel.querySelector('#detClose').addEventListener('click', closePanel);

  panel.querySelector('#detTitle').addEventListener('input', (e)=>{
    card.title = e.target.value;
    saveData(card.scope);
  });
  panel.querySelector('#detPhase').addEventListener('change', (e)=>{
    card.phase = e.target.value;
    saveData(card.scope);
  });
  panel.querySelectorAll('.swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.idx;
      card.colorIndex = idx === 'none' ? null : Number(idx);
      saveData(card.scope);
      panel.querySelectorAll('.swatch').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      panel.querySelector('#swatchCurrent').textContent = card.colorIndex!=null
        ? (board.assigneeNames[card.colorIndex] || PALETTE[card.colorIndex].name)
        : '担当者未設定';
    });
  });
  panel.querySelector('#detDue').addEventListener('change', (e)=>{
    card.dueDate = e.target.value;
    saveData(card.scope);
  });
  panel.querySelector('#detMemo').addEventListener('input', (e)=>{
    card.memo = e.target.value;
    saveData(card.scope);
  });
  panel.querySelector('#detDelete').addEventListener('click', ()=>{
    openConfirmModal({
      title: 'カードを削除',
      message: 'このカードを削除しますか？この操作は取り消せません。',
      confirmLabel: '削除する',
      onConfirm(){
        const store = storeOf(card.scope);
        store.cards = store.cards.filter(c=>c.id!==card.id);
        saveData(card.scope);
        closePanel();
      }
    });
  });

  function renderTodos(){
    const list = panel.querySelector('#todoList');
    if(!card.todos.length){
      list.innerHTML = '<div class="todo-empty">タスクはまだありません</div>';
      return;
    }
    list.innerHTML = card.todos.map(t => `
      <div class="todo-item ${t.done?'done':''}" data-todo="${t.id}">
        <input type="checkbox" ${t.done?'checked':''} data-check="${t.id}">
        <span>${esc(t.text)}</span>
        <button class="todo-del" data-del="${t.id}">×</button>
      </div>
    `).join('');
    list.querySelectorAll('[data-check]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const t = card.todos.find(x=>x.id===cb.dataset.check);
        t.done = cb.checked;
        saveData(card.scope);
        renderTodos();
      });
    });
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        card.todos = card.todos.filter(x=>x.id!==btn.dataset.del);
        saveData(card.scope);
        renderTodos();
      });
    });
  }
  renderTodos();

  const todoInput = panel.querySelector('#todoInput');
  function addTodo(){
    const text = todoInput.value.trim();
    if(!text) return;
    card.todos.push({ id: uid(), text, done:false });
    todoInput.value = '';
    saveData(card.scope);
    renderTodos();
    todoInput.focus();
  }
  panel.querySelector('#todoAddBtn').addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTodo(); });
}

/* ---------------- Generic modal helpers (no native alert/confirm/prompt) ---------------- */

function openPromptModal({ title, hint, placeholder, confirmLabel, initialValue, onSubmit }){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      ${hint ? `<p class="modal-hint">${esc(hint)}</p>` : ''}
      <input type="text" id="promptInput" placeholder="${esc(placeholder||'')}" maxlength="20" value="${esc(initialValue||'')}">
      <div class="modal-actions">
        <button class="btn ghost" id="promptCancel">キャンセル</button>
        <button class="btn seal" id="promptOk">${esc(confirmLabel||'OK')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#promptInput');
  input.focus();
  input.select();
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#promptCancel').addEventListener('click', close);
  const submit = ()=>{
    const val = input.value.trim();
    if(!val) return;
    close();
    onSubmit(val);
  };
  overlay.querySelector('#promptOk').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
}

function openConfirmModal({ title, message, confirmLabel, onConfirm }){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <p class="modal-hint">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="confCancel">キャンセル</button>
        <button class="btn seal" id="confOk">${esc(confirmLabel||'削除する')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#confCancel').addEventListener('click', close);
  overlay.querySelector('#confOk').addEventListener('click', ()=>{
    close();
    onConfirm();
  });
}

function openInfoModal(title, message){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <p class="modal-hint">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn seal" id="infoOk">わかった</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#infoOk').addEventListener('click', close);
}

/* ---------------- Init ---------------- */

// 保存機能そのものが使えるかどうかを軽く検証する（未ログイン・無料プランなどでは失敗し得る）
async function probeStorage(){
  try{
    await window.storage.set('__probe__', String(Date.now()), false);
    return true;
  }catch(e){
    return false;
  }
}

function showStorageBanner(){
  const banner = document.getElementById('storageBanner');
  if(!banner) return;
  banner.style.display = 'block';
  banner.innerHTML = `<strong>⚠ 個人用の保存機能が利用できていません。</strong> 個人用カテゴリの追加・変更が保存されない可能性があります。Claudeにログインし、Pro／Max／Team／Enterpriseのいずれかのプランでこのページを開くと解消することが多いです。`;
}
function hideStorageBanner(){
  const banner = document.getElementById('storageBanner');
  if(banner) banner.style.display = 'none';
}

function showSupabaseBanner(kind){
  const banner = document.getElementById('supabaseBanner');
  if(!banner) return;
  banner.style.display = 'block';
  if(kind === 'unconfigured'){
    banner.classList.add('info');
    banner.innerHTML = `<strong>ℹ 共有カテゴリはまだ外部共有用に設定されていません。</strong> 現在、共有カテゴリはClaudeの保存機能（ログイン必須）を使っています。Claudeアカウントを持たない人とも共有したい場合は、コード内のSUPABASE_URLとSUPABASE_ANON_KEYを設定してください。`;
  } else {
    banner.classList.remove('info');
    banner.innerHTML = `<strong>⚠ 共有データの取得に失敗しました。</strong> Supabaseの接続設定、またはネットワーク状況をご確認のうえ「🔄 データを再読み込み」をお試しください。<br><span style="font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.85;">詳細: ${esc(sharedLoadErrorMessage || '不明なエラー')}</span>`;
  }
}
function hideSupabaseBanner(){
  const banner = document.getElementById('supabaseBanner');
  if(banner) banner.style.display = 'none';
}

function updateBanners(storageOk){
  if(storageOk) hideStorageBanner(); else showStorageBanner();
  if(!isSupabaseConfigured()) showSupabaseBanner('unconfigured');
  else if(sharedLoadError) showSupabaseBanner('error');
  else hideSupabaseBanner();
}

async function refreshAllData(){
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = '読み込み中…'; }
  const storageOk = await probeStorage();
  await loadData();
  updateBanners(storageOk);
  render();
  if(btn){ btn.disabled = false; btn.textContent = '🔄 データを再読み込み'; }
}

(async function init(){
  document.getElementById('boardArea').innerHTML = '<div class="empty-state"><h2>読み込み中...</h2></div>';
  const storageOk = await probeStorage();
  await loadData();
  // 一時的な通信エラーに備え、共有データが空だった場合は1回だけ自動で再取得する
  if(isSupabaseConfigured() && stores.shared.boards.length === 0){
    await new Promise(r => setTimeout(r, 600));
    await loadScope('shared', true);
    if(allBoards().length && !activeBoardId){
      activeBoardId = allBoards()[0].id;
    }
  }
  updateBanners(storageOk);
  render();
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', refreshAllData);
})();
</script>
